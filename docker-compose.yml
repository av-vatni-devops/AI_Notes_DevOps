version: "3.9"

services:
  backend:
    build:
      context: ./server
      target: prod
    container_name: nurabackend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/neuranotes
      JWT_SECRET: dev_secret
    depends_on:
      - mongo
    
  frontend:
    build:
      context: ./client/my-project
    container_name: nurafrontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    
  mongo:
    image: mongo:6
    container_name: nuramongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data: